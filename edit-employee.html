<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Employee - Employee Onboarding System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="dashboard.html">
                <i class="bi bi-person-badge"></i>
                Employee Onboarding
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="companies.html">
                            Companies
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="master-data.html">
                            Master Data
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="employees.html">
                            Employees
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="onboarding.html">
                            Onboarding
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="documents.html">
                            Documents
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-danger" href="#" onclick="logout()">
                            <i class="bi bi-box-arrow-right"></i>
                            Logout
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- Main Content -->
    <div class="container-fluid page-content">

        <div class="mb-4">

            <a
                href="employees.html"
                class="text-decoration-none">

                <i class="bi bi-arrow-left"></i>
                Back to Employees

            </a>

            <h2 class="page-heading mt-3">

                <i class="bi bi-pencil-square"></i>
                Edit Employee

            </h2>

            <p class="text-muted mb-0">
                Update employee information.
            </p>

        </div>


        <!-- Employee Form -->

        <div class="card add-employee-card shadow-sm">

            <div class="card-body p-4">

                <form id="editEmployeeForm">

                    <input
                        type="hidden"
                        id="editEmployeeDatabaseId">


                    <!-- Personal Information -->

                    <div class="form-section">

                        <div class="form-section-title">

                            <i class="bi bi-person"></i>

                            Personal Information

                        </div>


                        <div class="row g-4">

                            <div class="col-md-6">

                                <label class="form-label">
                                    First Name
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="text"
                                    id="editFirstName"
                                    class="form-control"
                                    required>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Last Name
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="text"
                                    id="editLastName"
                                    class="form-control"
                                    required>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Email Address
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="email"
                                    id="editEmail"
                                    class="form-control"
                                    required>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    id="editPhone"
                                    class="form-control">

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Date of Birth
                                </label>

                                <input
                                    type="date"
                                    id="editDob"
                                    class="form-control">

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Gender
                                </label>

                                <select
                                    id="editGender"
                                    class="form-select">

                                    <option value="">
                                        Select Gender
                                    </option>

                                    <option value="Male">
                                        Male
                                    </option>

                                    <option value="Female">
                                        Female
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>


                    <!-- Employment Information -->

                    <div class="form-section">

                        <div class="form-section-title">

                            <i class="bi bi-briefcase"></i>

                            Employment Information

                        </div>


                        <div class="row g-4">

                            <div class="col-md-6">

                                <label class="form-label">
                                    Employee ID
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="number"
                                    id="editEmployeeId"
                                    class="form-control"
                                    required>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Company
                                </label>

                                <select
                                    id="editCompany"
                                    class="form-select">

                                    <option value="">
                                        Select Company
                                    </option>

                                    <option value="ABC Technologies">
                                        ABC Technologies
                                    </option>

                                    <option value="XYZ Solutions">
                                        XYZ Solutions
                                    </option>

                                    <option value="Tech Lanka">
                                        Tech Lanka
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Department
                                    <span class="text-danger">*</span>
                                </label>

                                <select
                                    id="editDepartment"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        Select Department
                                    </option>

                                    <option value="IT">
                                        IT
                                    </option>

                                    <option value="Human Resources">
                                        Human Resources
                                    </option>

                                    <option value="Finance">
                                        Finance
                                    </option>

                                    <option value="Marketing">
                                        Marketing
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Designation
                                    <span class="text-danger">*</span>
                                </label>

                                <select
                                    id="editDesignation"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        Select Designation
                                    </option>

                                    <option value="Software Engineer">
                                        Software Engineer
                                    </option>

                                    <option value="HR Executive">
                                        HR Executive
                                    </option>

                                    <option value="Accountant">
                                        Accountant
                                    </option>

                                    <option value="Marketing Executive">
                                        Marketing Executive
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Employment Type
                                </label>

                                <select
                                    id="editEmploymentType"
                                    class="form-select">

                                    <option value="">
                                        Select Employment Type
                                    </option>

                                    <option value="Full Time">
                                        Full Time
                                    </option>

                                    <option value="Part Time">
                                        Part Time
                                    </option>

                                    <option value="Contract">
                                        Contract
                                    </option>

                                    <option value="Intern">
                                        Intern
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Joining Date
                                </label>

                                <input
                                    type="date"
                                    id="editJoiningDate"
                                    class="form-control">

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Work Location
                                </label>

                                <select
                                    id="editLocation"
                                    class="form-select">

                                    <option value="">
                                        Select Location
                                    </option>

                                    <option value="Colombo Office">
                                        Colombo Office
                                    </option>

                                    <option value="Kandy Office">
                                        Kandy Office
                                    </option>

                                    <option value="Galle Office">
                                        Galle Office
                                    </option>

                                    <option value="Remote">
                                        Remote
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Status
                                </label>

                                <select
                                    id="editStatus"
                                    class="form-select">

                                    <option value="Active">
                                        Active
                                    </option>

                                    <option value="Inactive">
                                        Inactive
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>


                    <!-- Address Information -->

                    <div class="form-section">

                        <div class="form-section-title">

                            <i class="bi bi-geo-alt"></i>

                            Address Information

                        </div>


                        <div class="row g-4">

                            <div class="col-12">

                                <label class="form-label">
                                    Address
                                </label>

                                <textarea
                                    id="editAddress"
                                    class="form-control"
                                    rows="3">
                                </textarea>

                            </div>


                            <div class="col-md-4">

                                <label class="form-label">
                                    City
                                </label>

                                <input
                                    type="text"
                                    id="editCity"
                                    class="form-control">

                            </div>


                            <div class="col-md-4">

                                <label class="form-label">
                                    Province
                                </label>

                                <input
                                    type="text"
                                    id="editProvince"
                                    class="form-control">

                            </div>


                            <div class="col-md-4">

                                <label class="form-label">
                                    Postal Code
                                </label>

                                <input
                                    type="text"
                                    id="editPostalCode"
                                    class="form-control">

                            </div>

                        </div>

                    </div>


                    <!-- Emergency Contact -->

                    <div class="form-section">

                        <div class="form-section-title">

                            <i class="bi bi-telephone"></i>

                            Emergency Contact

                        </div>


                        <div class="row g-4">

                            <div class="col-md-6">

                                <label class="form-label">
                                    Contact Name
                                </label>

                                <input
                                    type="text"
                                    id="editEmergencyName"
                                    class="form-control">

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Relationship
                                </label>

                                <input
                                    type="text"
                                    id="editEmergencyRelationship"
                                    class="form-control">

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Contact Number
                                </label>

                                <input
                                    type="tel"
                                    id="editEmergencyPhone"
                                    class="form-control">

                            </div>

                        </div>

                    </div>


                    <!-- Buttons -->

                    <div class="form-actions">

                        <a
                            href="employees.html"
                            class="btn btn-light border">

                            <i class="bi bi-x-lg"></i>
                            Cancel

                        </a>


                        <button
                            type="submit"
                            class="btn btn-primary">

                            <i class="bi bi-check-lg"></i>
                            Update Employee

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./app.js"></script>

</body>

</html>
